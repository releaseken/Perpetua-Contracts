# Perpetua cliff-vesting contract — standalone Cargo project.
#
# Manages cliff-vesting schedules: tokens are locked, accrue linearly from
# start_time, but are withheld until cliff_time. Provides granular role-based
# authorization (#403) and optimized batch deserialization (#404).
#
#   cargo build  --target wasm32v1-none --release
#   cargo test

[workspace]
resolver = "2"
members = ["."]

[package]
name = "perpetua-cliff-vesting"
description = "Cliff-vesting schedule registry for Perpetua"
version = "1.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/hannyloveworld/Perpetua-Contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
proptest = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = true
incremental = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
