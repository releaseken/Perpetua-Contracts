# Perpetua dispute-window contract — standalone Cargo project.
#
# Adjudicates batch stream claims inside a bounded time window.
# Integrates with the stream contract for cross-contract invocations.
#
# Build:
#   cargo build --target wasm32v1-none --release
# Test (host target):
#   cargo test

[workspace]
resolver = "2"
members = ["."]

[package]
name = "fluxora-dispute-window"
description = "Batch-claim dispute window for Perpetua"
version = "1.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/hannyloveworld/Perpetua-Contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = true
incremental = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
