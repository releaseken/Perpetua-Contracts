# Perpetua event-sink contract — standalone Cargo project.
#
# A structured, permissioned event-sink for the Perpetua protocol.  External
# contracts (stream, cliff-vesting, pause-clock, …) emit typed audit-log
# entries here via `emit`.  Client tooling observes the ledger for structured
# `SinkEntry` events with rich, machine-readable metadata instead of relying
# on raw host-event inspection.
#
# Issue #461: modularise error types and add custom error messages for
# enhanced client observability.
#
#   cargo build  --target wasm32v1-none --release
#   cargo test

[workspace]
resolver = "2"
members = ["."]

[package]
name = "perpetua-event-sink"
description = "Structured audit-log event-sink for Perpetua"
version = "1.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/releaseken/Perpetua-Contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = true
incremental = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
